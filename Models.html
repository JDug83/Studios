        <script>
            function getActiveSession() {
                const keys = ['gazstudios_session', 'gz.session.3'];
                for (const k of keys) {
                    try {
                        const raw = localStorage.getItem(k);
                        if (raw) {
                            const sess = JSON.parse(raw);
                            if (sess && sess.username && sess.expires > Date.now()) {
                                return sess;
                            }
                        }
                    } catch (e) { }
                }
                return null;
            }

            function signOut() {
                ['gazstudios_session', 'gz.session.3'].forEach(k => localStorage.removeItem(k));
                checkSignInStatus();
            }

            function checkSignInStatus() {
                const signInBlock = document.getElementById('signInBlock');
                const signedInBlock = document.getElementById('signedInBlock');
                const sess = getActiveSession();

                if (sess) {
                    signInBlock.style.display = 'none';
                    signedInBlock.style.display = 'block';
                    document.getElementById('signedInText').textContent = 'Signed in as ' + sess.username;
                } else {
                    signInBlock.style.display = 'flex';
                    signedInBlock.style.display = 'none';
                }
            }

            checkSignInStatus();
        </script>
