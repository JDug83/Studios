<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial for making the page scale properly on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Keeps the app in full-screen mode when added to mobile home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>GazBrowse</title>
    <script src="result.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #1c1e21;
            padding-bottom: 90px; /* Space so content isn't hidden behind the mobile dock */
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Desktop Navigation */
        .desktop-nav {
            margin-bottom: 20px;
        }

        .desktop-nav a {
            text-decoration: none;
            color: #0066cc;
            font-weight: 600;
        }

        #searchTitle {
            margin-bottom: 16px;
            font-size: 1.5rem;
        }

        #resultContainer {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            min-height: 200px;
        }

        /* Mobile Dock (Hidden on Desktop by default) */
        .mobile-dock {
            display: none;
        }

        /* In-App Browser Modal for Mobile */
        #inAppBrowser {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 2000;
            flex-direction: column;
        }

        .browser-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f1f1f1;
            border-bottom: 1px solid #ddd;
        }

        .browser-header span {
            font-size: 0.9rem;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
        }

        .close-btn {
            background: #0066cc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        #appIframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        /* Mobile-Specific Styles */
        @media (max-width: 768px) {
            .desktop-nav {
                display: none; /* Hide top home link on mobile */
            }

            .mobile-dock {
                display: flex;
                justify-content: space-around;
                align-items: center;
                position: fixed;
                bottom: 16px;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 400px;
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                padding: 12px 20px;
                border-radius: 30px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
                border: 1px solid rgba(0, 0, 0, 0.08);
                z-index: 1000;
            }

            .dock-item {
                text-decoration: none;
                color: #333;
                font-size: 0.85rem;
                font-weight: 600;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                background: none;
                border: none;
                cursor: pointer;
            }

            .dock-item:active {
                transform: scale(0.92);
            }

            .dock-icon {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Visible only on Desktop -->
        <nav class="desktop-nav">
            <a href="index.html">← Home</a>
        </nav>

        <h2 id="searchTitle">Showing results</h2>
        
        <!-- Fixed the missing closing quote on resultContainer -->
        <div id="resultContainer">
            <!-- result.js will populate links here -->
        </div>
    </div>

    <!-- Floating Bottom Dock (Visible only on Mobile) -->
    <nav class="mobile-dock">
        <button class="dock-item" onclick="history.back()">
            <span class="dock-icon">⬅️</span>
            <span>Back</span>
        </button>
        <a href="index.html" class="dock-item" data-internal="true">
            <span class="dock-icon">🏠</span>
            <span>Home</span>
        </a>
        <button class="dock-item" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <span class="dock-icon">⬆️</span>
            <span>Top</span>
        </button>
        <button class="dock-item" onclick="location.reload()">
            <span class="dock-icon">🔄</span>
            <span>Reload</span>
        </button>
    </nav>

    <!-- In-App Browser View for Mobile Links -->
    <div id="inAppBrowser">
        <div class="browser-header">
            <span id="browserUrl">Loading...</span>
            <button class="close-btn" onclick="closeInAppBrowser()">Done</button>
        </div>
        <iframe id="appIframe" src=""></iframe>
    </div>

    <script>
        // Check if the user is on a mobile screen size or mobile device
        function isMobileDevice() {
            return window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        // Intercept clicks on any link inside the page
        document.addEventListener('click', function(event) {
            const link = event.target.closest('a');
            if (!link || !link.href) return;

            if (isMobileDevice()) {
                // Allow internal navigation (like the Home button) to stay inside the web app frame
                if (link.getAttribute('data-internal') === 'true') {
                    event.preventDefault();
                    window.location.assign(link.href);
                    return;
                }

                // Prevent mobile browser from opening external tabs/apps and open in the in-app view instead
                event.preventDefault();
                openInAppBrowser(link.href);
            } else {
                // Desktop behavior: Let links open normally (or force standard tab behavior)
                // If result.js sets target="_blank", it will work normally on desktop.
            }
        });

        function openInAppBrowser(url) {
            const browserModal = document.getElementById('inAppBrowser');
            const iframe = document.getElementById('appIframe');
            const urlText = document.getElementById('browserUrl');

            urlText.textContent = url;
            iframe.src = url;
            browserModal.style.display = 'flex';
        }

        function closeInAppBrowser() {
            const browserModal = document.getElementById('inAppBrowser');
            const iframe = document.getElementById('appIframe');

            iframe.src = '';
            browserModal.style.display = 'none';
        }
    </script>
</body>
</html>
