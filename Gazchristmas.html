<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GazChristmas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='90'>🎄</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>GazChristmas</h1>
        </header>

        <!-- Color Picker -->
        <div class="color-picker-wrap">
            <div class="color-picker">
                <button class="color-btn" data-color="#F5624D" style="background:#F5624D;" aria-label="Coral"></button>
                <button class="color-btn active" data-color="#CC231E" style="background:#CC231E;" aria-label="Red"></button>
                <button class="color-btn" data-color="#34A65F" style="background:#34A65F;" aria-label="Green"></button>
                <button class="color-btn" data-color="#0F8A5F" style="background:#0F8A5F;" aria-label="Teal"></button>
                <button class="color-btn" data-color="#235E6F" style="background:#235E6F;" aria-label="Navy"></button>
            </div>
        </div>

        <!-- Wake Time Picker -->
        <div class="control-panel">
            <label for="wakeTime">Wake up at</label>
            <select id="wakeTime">
                <option value="0">Midnight</option>
                <option value="6">6:00 AM</option>
                <option value="7" selected>7:00 AM</option>
                <option value="8">8:00 AM</option>
                <option value="9">9:00 AM</option>
            </select>
        </div>

        <!-- Main Countdown -->
        <main class="countdown-container">
            <div class="countdown" id="countdown">
                <div class="unit">
                    <div class="value" id="days">00</div>
                    <div class="unit-label">Days</div>
                </div>
                <div class="divider"></div>
                <div class="unit">
                    <div class="value" id="hours">00</div>
                    <div class="unit-label">Hours</div>
                </div>
                <div class="divider"></div>
                <div class="unit">
                    <div class="value" id="mins">00</div>
                    <div class="unit-label">Mins</div>
                </div>
                <div class="divider"></div>
                <div class="unit">
                    <div class="value" id="secs">00</div>
                    <div class="unit-label">Secs</div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>🎄 See you on December 25th 🎅</p>
        </footer>
    </div>

    <style>
        :root {
            --bg-color: #CC231E;
            --text-color: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.25);
            --card-border: rgba(255, 255, 255, 0.15);
            --accent-light: rgba(255, 255, 255, 0.08);
            --safe-top: env(safe-area-inset-top, 0);
            --safe-bottom: env(safe-area-inset-bottom, 0);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.9) 2.5%, transparent 0),
                radial-gradient(circle at 30% 90%, rgba(255, 255, 255, 0.8) 1.5%, transparent 0),
                radial-gradient(circle at 70% 10%, rgba(255, 255, 255, 0.7) 1%, transparent 0),
                radial-gradient(circle at 10% 40%, rgba(255, 255, 255, 0.6) 1%, transparent 0);
            background-size: 45vmin 35vmin, 50vmin 70vmin, 60vmin 50vmin, 65vmin 50vmin;
            background-position: 0 0, 0 0, 0 0, 0 0;
            animation: snow 5s infinite linear;
        }

        @keyframes snow {
            0% {
                background-position: 0 0, 0 0, 0 0, 0 0;
            }
            40% {
                background-position: 10px 14vmin, -20px 28vmin, 20px 20vmin, 75px 20vmin;
            }
            60% {
                background-position: -10px 21vmin, -30px 42vmin, 30px 30vmin, 50px 30vmin;
            }
            100% {
                background-position: 0 35vmin, 0 70vmin, 0 50vmin, 0 50vmin;
            }
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            overflow: hidden;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 12px 16px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--card-border);
        }

        .header h1 {
            margin: 0;
            font-size: clamp(20px, 6vw, 28px);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Color Picker */
        .color-picker-wrap {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            padding: 12px 16px;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
        }

        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 0;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            flex-shrink: 0;
        }

        .color-btn:active {
            transform: scale(1.15);
        }

        .color-btn.active {
            border-color: #fff;
            transform: scale(1.2);
        }

        /* Control Panel */
        .control-panel {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--accent-light);
        }

        .control-panel label {
            font-size: 14px;
            font-weight: 500;
        }

        .control-panel select {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .control-panel select:active {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .control-panel select option {
            background: #1a1a1a;
            color: #fff;
        }

        /* Main Countdown */
        .countdown-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            min-height: 0;
        }

        .countdown {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 14px;
            min-width: 70px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .unit .value {
            font-size: clamp(32px, 10vw, 52px);
            font-weight: 700;
            font-family: 'Courier New', monospace;
            line-height: 1;
            letter-spacing: -1px;
        }

        .unit-label {
            font-size: clamp(10px, 2.5vw, 12px);
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.85;
            font-weight: 500;
        }

        .divider {
            font-size: clamp(28px, 8vw, 44px);
            font-weight: 700;
            opacity: 0.6;
            padding: 0 2px;
            line-height: 1;
            margin: 0 -2px;
        }

        .divider::before {
            content: ':';
        }

        /* Footer */
        .footer {
            flex-shrink: 0;
            text-align: center;
            padding: 12px 16px;
            border-top: 1px solid var(--card-border);
            font-size: 14px;
            opacity: 0.9;
        }

        .footer p {
            margin: 0;
        }

        /* Responsive: Small phones */
        @media (max-width: 320px) {
            .countdown {
                gap: 6px;
            }

            .unit {
                padding: 12px 10px;
                min-width: 60px;
            }

            .divider {
                display: none;
            }
        }

        /* Landscape mode */
        @media (max-aspect-ratio: 9 / 16) {
            .countdown-container {
                padding: 16px;
            }

            .unit .value {
                font-size: clamp(28px, 8vw, 40px);
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            html, body {
                animation: none;
            }

            .color-btn {
                transition: none;
            }
        }
    </style>

    <script>
        // Theme switching
        const colorButtons = document.querySelectorAll('.color-btn');
        colorButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const color = btn.getAttribute('data-color');
                document.documentElement.style.setProperty('--bg-color', color);
                colorButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Countdown logic
        const wakeTimeSelect = document.getElementById('wakeTime');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minsEl = document.getElementById('mins');
        const secsEl = document.getElementById('secs');
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            const now = new Date();
            const year = now.getFullYear();
            const hour = parseInt(wakeTimeSelect.value, 10);
            
            let target = new Date(year, 11, 25, hour, 0, 0);
            if (now > target) {
                target = new Date(year + 1, 11, 25, hour, 0, 0);
            }

            const diff = target - now;
            
            if (diff <= 0) {
                countdownEl.innerHTML = "<div style='text-align: center; font-size: clamp(24px, 6vw, 40px); font-weight: bold; letter-spacing: 1px;'>🎄 Merry Christmas! 🎅</div>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            daysEl.textContent = String(d).padStart(2, '0');
            hoursEl.textContent = String(h).padStart(2, '0');
            minsEl.textContent = String(m).padStart(2, '0');
            secsEl.textContent = String(s).padStart(2, '0');
        }

        wakeTimeSelect.addEventListener('change', updateCountdown);
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
