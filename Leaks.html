<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming updates</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f8f9fa;
      color: #202124;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e2e6;
    }

    .top-bar h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
    }

    /* Button 17 (Home link) */
    .button-17 {
      align-items: center;
      appearance: none;
      -webkit-appearance: none;
      background-color: #fff;
      border: 2px solid transparent;
      border-radius: 24px;
      box-shadow: rgba(60, 64, 67, 0.3) 0 1px 3px 0, rgba(60, 64, 67, 0.15) 0 4px 8px 3px;
      box-sizing: border-box;
      color: #3c4043;
      cursor: pointer;
      display: inline-flex;
      font-size: 14px;
      font-weight: 500;
      height: 42px;
      justify-content: center;
      letter-spacing: 0.25px;
      padding: 0 20px;
      text-decoration: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background-color 200ms ease, box-shadow 280ms cubic-bezier(0.4, 0, 0.2, 1), color 200ms ease, border-color 200ms ease;
    }

    .button-17:hover {
      background-color: #f6f9fe;
      color: #174ea6;
      box-shadow: rgba(60, 64, 67, 0.3) 0 2px 3px 0, rgba(60, 64, 67, 0.15) 0 6px 10px 4px;
    }

    .button-17:focus-visible {
      outline: none;
      border-color: #4285f4;
      box-shadow: rgba(60, 64, 67, 0.3) 0 1px 3px 0, rgba(60, 64, 67, 0.15) 0 4px 8px 3px;
    }

    .button-17:active {
      background-color: #e8f0fe;
      box-shadow: rgba(60, 64, 67, 0.3) 0 4px 4px 0, rgba(60, 64, 67, 0.15) 0 8px 12px 6px;
      outline: none;
    }

    /* Button 33 (Green pill button) */
    .button-33 {
      background-color: #c2fbd7;
      border-radius: 100px;
      box-shadow: rgba(44, 187, 99, .2) 0 -25px 18px -14px inset,
                  rgba(44, 187, 99, .15) 0 1px 2px,
                  rgba(44, 187, 99, .15) 0 2px 4px,
                  rgba(44, 187, 99, .15) 0 4px 8px,
                  rgba(44, 187, 99, .15) 0 8px 16px,
                  rgba(44, 187, 99, .15) 0 16px 32px;
      color: green;
      cursor: pointer;
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 20px;
      text-align: center;
      text-decoration: none;
      transition: all 250ms;
      border: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin-top: 8px;
    }

    .button-33:hover {
      box-shadow: rgba(44, 187, 99, .35) 0 -25px 18px -14px inset,
                  rgba(44, 187, 99, .25) 0 1px 2px,
                  rgba(44, 187, 99, .25) 0 2px 4px,
                  rgba(44, 187, 99, .25) 0 4px 8px,
                  rgba(44, 187, 99, .25) 0 8px 16px,
                  rgba(44, 187, 99, .25) 0 16px 32px;
      transform: scale(1.05) rotate(-1deg);
    }

    /* Content styling */
    .content {
      padding: 32px;
      max-width: 800px;
      margin: 0 auto;
    }

    .update-list {
      list-style-type: disc;
      padding-left: 20px;
      line-height: 1.8;
    }

    .update-list li {
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <h1>Upcoming Gaz updates</h1>
    <a href="https://jdug83.github.io/Studios/" class="button-17" role="button">Home</a>
  </header>

  <main class="content">
    <h2>November</h2>
    <ul class="update-list">
      <li>
        <div>Gazcode - Bug fix and auto-complete engine update</div> 
             <button class="button-33" type="button">Completed</button>
      </li>
      <li>Studios - Home page update</li>
          <button class="button-33" type="button">In dev</button>
      <li>New apps - Possibly this month, a new app might be added</li>
          <button class="button-33" type="button">Not Planned - Possible</button>
    </ul>
        

    <h2>December</h2>
    <ul class="update-list">
        <li>
            GazChat - Gaz nano 2 updated model
            </li>
                <button class="button-33" type="button">In Dev</button>
                <li>
                    Studios - Home page update
                    </li>
                        <button class="button-33" type="button">Planned</button>
 <li>
                   GazCode - Design overhaul
                    </li>
                        <button class="button-33" type="button">Planned</button>
                            

    </ul>
  </main>

</body>
</html>
